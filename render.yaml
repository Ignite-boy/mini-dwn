services:
  - type: web
    name: mini-dwn
    env: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DWN_HOST
        value: 0.0.0.0
      - key: DWN_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
